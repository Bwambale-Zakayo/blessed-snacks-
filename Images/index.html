<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<meta name="description" content="Blessed Snacks – Rolex, Kikomando, crispy chicken wings, foods, drinks and cakes. Order online and get it delivered in Kampala.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="topbar">
  <button id="menuToggle" class="icon-btn mobile-only" aria-label="Open menu">
    <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
  </button>
  <a href="#/home" class="brand" aria-label="Blessed Snacks home">
    <span class="brand-script">Blessed</span><span class="brand-bold">SNACKS</span><span class="brand-emoji">😊</span>
  </a>
  <div class="top-actions">
    <a href="#/cart" class="icon-btn" aria-label="Cart">
      <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="20" r="1.5"/><circle cx="18" cy="20" r="1.5"/><path d="M2 3h3l2.7 12.4a2 2 0 0 0 2 1.6h7.7a2 2 0 0 0 2-1.5L21 7H6"/></svg>

    </a>
    <button id="signInBtn" class="icon-btn signin" aria-label="Sign in">
      <svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7"/></svg>
      <span id="signInLabel">Sign in</span>
    </button>
  </div>
</header>

<div class="layout">
  <main id="app" tabindex="-1"></main>
  <nav id="sideNav" class="sidenav" aria-label="Main pages"></nav>
</div>
<div id="navScrim" class="scrim"></div>

<div id="cartBar" class="cartbar hidden"></div>
<div id="toasts" class="toasts" aria-live="polite"></div>
<div id="modal" class="modal hidden" role="dialog" aria-modal="true"><div class="modal-box" id="modalBox"></div></div>

<script src="script.js"></script>
</body>
</html>
